<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbeatable Noughts & Crosses</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Noughts <span class="highlight">&</span> Crosses</h1>
            <p>Can you beat the AI?</p>
        </header>

        <!-- Main Game Area -->
        <main id="game-area" class="hidden">
            <div class="hud">
                <div class="score-box">
                    <span>Session Score:</span>
                    <span id="score-display">0</span>
                </div>
                <div id="status-display" class="status">Your Turn</div>
            </div>

            <div class="board" id="board">
                <!-- Grid Cells Generated by JS -->
            </div>

            <div class="controls">
                <button onclick="saveScorePrompt()" class="btn secondary">Save Score</button>
                <button onclick="showMenu()" class="btn danger">Quit</button>
            </div>
        </main>

        <!-- Main Menu -->
        <section id="menu-area">
            <button onclick="startGame('single')" class="btn primary huge glow">vs AI (Single Player)</button>
            <button onclick="startGame('multi')" class="btn primary huge">vs Human (2 Player)</button>
            <button onclick="showLeaderboard()" class="btn secondary huge">Leaderboard</button>
        </section>

        <!-- Leaderboard Modal -->
        <div id="leaderboard-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Top Players</h2>
                <ul id="leaderboard-list">
                    <!-- Loaded dynamically -->
                </ul>
                <button onclick="closeModal('leaderboard-modal')" class="btn">Close</button>
            </div>
        </div>

        <!-- Start/Message Modal -->
        <div id="message-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Game Over</h2>
                <p id="modal-msg">Checkmate!</p>
                <button onclick="startGame()" class="btn primary">Play Again</button>
                <button onclick="showMenu()" class="btn secondary">Menu</button>
            </div>
        </div>

        <!-- Save Score Modal -->
        <div id="save-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Save Your Score</h2>
                <p>Enter your username to save your session score.</p>
                <input type="text" id="username-input" placeholder="Player Name" maxlength="15">
                <div class="modal-actions">
                    <button onclick="submitScore()" class="btn primary">Save</button>
                    <button onclick="closeModal('save-modal')" class="btn secondary">Cancel</button>
                </div>
            </div>
        </div>

    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
