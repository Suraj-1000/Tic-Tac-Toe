{% extends "base.html" %}

{% block title %}Hangman{% endblock %}

{% block head %}
<style>
    .word-display {
        font-family: 'Courier New', monospace;
        font-size: 3rem;
        letter-spacing: 15px;
        margin: 40px 0;
        font-weight: bold;
    }

    .keyboard {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        max-width: 600px;
        margin: 0 auto;
    }

    .key-btn {
        width: 45px;
        height: 55px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 1.2rem;
        border-radius: 5px;
        cursor: pointer;
        font-family: 'Orbitron';
        transition: 0.2s;
    }

    .key-btn:hover:not(:disabled) {
        background: var(--secondary);
        color: #000;
        transform: translateY(-2px);
    }

    .key-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .key-btn.correct {
        background: var(--primary);
        color: #000;
        border-color: var(--primary);
    }

    .key-btn.wrong {
        background: var(--danger);
        border-color: var(--danger);
    }

    .lives-container {
        font-size: 1.5rem;
        color: var(--danger);
        text-shadow: 0 0 10px var(--danger);
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <header>
        <h1>Hang<span class="highlight">Man</span></h1>
        <p>Guess the word!</p>
    </header>

    <div class="hud">
        <div class="lives-container" id="lives-display">
            ❤️❤️❤️❤️❤️❤️
        </div>
        <div id="status-display" class="status">Pick a letter</div>
    </div>

    <div class="word-display" id="word-display">
        _ _ _ _ _
    </div>

    <div class="keyboard" id="keyboard">
        <!-- Generated by JS -->
    </div>

    <button onclick="startHangman()" class="btn primary huge" id="restart-btn" style="display:none;">Play Again</button>

</div>

<script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    document.addEventListener('DOMContentLoaded', () => {
        startHangman();
    });

    async function startHangman() {
        document.getElementById('restart-btn').style.display = 'none';
        try {
            const res = await fetch('/api/hangman/start', { method: 'POST' });
            const data = await res.json();
            renderGame(data);
            generateKeyboard(data.guessed);
        } catch (e) {
            console.error(e);
        }
    }

    function generateKeyboard(guessed) {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        alphabet.split('').forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.textContent = letter;
            btn.onclick = () => makeGuess(letter);

            // If already guessed (e.g. recovering state if we added persistence later)
            if (guessed && guessed.includes(letter)) {
                btn.disabled = true;
            }

            kb.appendChild(btn);
        });
    }

    async function makeGuess(letter) {
        try {
            const res = await fetch('/api/hangman/guess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ letter })
            });
            const data = await res.json();

            // Update UI
            renderGame(data);

            // Update Key Status
            const buttons = document.querySelectorAll('.key-btn');
            buttons.forEach(btn => {
                if (btn.textContent === letter) {
                    btn.disabled = true;
                    if (data.correct) btn.classList.add('correct');
                    else btn.classList.add('wrong');
                }
            });

            if (data.status !== 'ongoing') {
                document.getElementById('status-display').textContent = data.status === 'win' ? "YOU WON!" : `GAME OVER: ${data.word}`;
                document.getElementById('restart-btn').style.display = 'block';
                // Disable all keys
                document.querySelectorAll('.key-btn').forEach(b => b.disabled = true);
            }

        } catch (e) {
            console.error(e);
        }
    }

    function renderGame(data) {
        document.getElementById('word-display').textContent = data.display;

        let hearts = "";
        for (let i = 0; i < data.lives; i++) hearts += "❤️";
        document.getElementById('lives-display').textContent = hearts;
    }
</script>
{% endblock %}
