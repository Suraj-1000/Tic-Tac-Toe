{% extends "base.html" %}

{% block title %}Neon Futsal 5v5{% endblock %}

{% block head %}
<style>
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
    }

    /* Futsal Court Style: Hard Court (Blue/Wood) */
    canvas {
        border: 4px solid #fff;
        background: #34495e;
        /* Hard Court Color */
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        cursor: none;
        /* Hide default cursor */
    }

    .scoreboard {
        display: flex;
        justify-content: space-between;
        width: 800px;
        margin-bottom: 10px;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 10px;
        color: white;
        font-family: 'Courier New', monospace;
        border: 1px solid #555;
    }

    .team-score {
        font-size: 2rem;
        font-weight: bold;
    }

    .team-blue {
        color: #3498db;
    }

    .team-red {
        color: #e74c3c;
    }

    .timer {
        font-size: 2rem;
        color: #f1c40f;
    }

    .controls-hint {
        margin-top: 15px;
        color: #ccc;
        font-size: 0.9em;
        text-align: center;
    }

    .key {
        display: inline-block;
        padding: 2px 6px;
        border: 1px solid #777;
        border-radius: 4px;
        background: #222;
        color: white;
        margin: 0 2px;
        font-family: monospace;
    }
</style>
{% endblock %}

{% block content %}
<div class="game-container">
    <div class="scoreboard">
        <div class="team-score team-blue">BLUE <span id="scoreBlue">0</span></div>
        <div class="timer" id="gameTimer">10:00</div>
        <div class="team-score team-red"><span id="scoreRed">0</span> RED</div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls-hint">
        <p>
            <span class="key">Arrows</span> / <span class="key">WASD</span> Move &nbsp;
            <span class="key">Space</span> / <span class="key">Click</span> Shoot/Pass &nbsp;
            <span class="key">Shift</span> Sprint
        </p>
        <p>First to 5 Goals Wins!</p>
    </div>
</div>

<script>
    // Configuration for Futsal
    window.SOCCER_CONFIG = {
        type: 'futsal',
        pitchColor: '#2c3e50',
        lineColor: '#ecf0f1',
        ballColor: '#f1c40f',
        playersPerTeam: 5,
        matchDuration: 600, // 10 minutes
        physics: {
            friction: 0.94, // Hard court, more friction/stop
            ballBounce: 0.6 // Low bounce futsal ball
        }
    };
</script>
<script src="{{ url_for('static', filename='game_soccer.js') }}"></script>
{% endblock %}
