{% extends "base.html" %}

{% block title %}Rock Paper Scissors{% endblock %}

{% block head %}
<style>
    .rps-choices {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 40px 0;
    }

    .rps-btn {
        font-size: 4rem;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        width: 120px;
        height: 120px;
        cursor: pointer;
        transition: 0.3s;
    }

    .rps-btn:hover {
        transform: scale(1.1) rotate(10deg);
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--primary);
        box-shadow: 0 0 20px var(--primary-glow);
    }

    .result-area {
        font-size: 1.5rem;
        min-height: 100px;
        margin-top: 20px;
    }

    .vs {
        font-family: 'Orbitron';
        font-size: 2rem;
        margin: 0 20px;
        color: var(--secondary);
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <header>
        <h1>Rock <span class="highlight">Paper</span> Scissors</h1>
        <p>Beat the Computer!</p>
    </header>

    <div class="hud">
        <div class="score-box">
            <span>Score:</span>
            <span id="score-display">0</span>
        </div>
        <div id="status-display" class="status">Make your move</div>
    </div>

    <div class="rps-choices">
        <button class="rps-btn" onclick="play('rock')">🪨</button>
        <button class="rps-btn" onclick="play('paper')">📄</button>
        <button class="rps-btn" onclick="play('scissors')">✂️</button>
    </div>

    <div class="result-area" id="result-area"></div>

</div>

<script>
    async function play(choice) {
        const resultDiv = document.getElementById('result-area');
        const scoreEl = document.getElementById('score-display');
        const statusEl = document.getElementById('status-display');

        resultDiv.innerHTML = '<span class="status">Computer is choosing...</span>';

        try {
            const res = await fetch('/api/rps/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ choice })
            });
            const data = await res.json();

            scoreEl.textContent = data.score;

            const emojis = { rock: '🪨', paper: '📄', scissors: '✂️' };

            let outcomeText = "";
            let outcomeClass = "";

            if (data.result === 'win') {
                outcomeText = "YOU WIN!";
                outcomeClass = "highlight";
            } else if (data.result === 'lose') {
                outcomeText = "YOU LOSE!";
                outcomeClass = "danger"; // Not strictly defined but usually red if system defaults allow, or fallback text color
            } else {
                outcomeText = "DRAW!";
                outcomeClass = "status";
            }

            statusEl.textContent = outcomeText;

            // Inline style logic for colors as simpler fallback
            let colorStyle = data.result === 'win' ? '#00ff88' : (data.result === 'lose' ? '#ff4444' : '#00ccff');

            resultDiv.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center;">
                    <div style="text-align: center;">
                        <div style="font-size: 3rem;">${emojis[data.user]}</div>
                        <small>You</small>
                    </div>
                    <span class="vs">VS</span>
                    <div style="text-align: center;">
                        <div style="font-size: 3rem;">${emojis[data.computer]}</div>
                        <small>Comp</small>
                    </div>
                </div>
                <h2 style="margin-top: 20px; color: ${colorStyle}; font-family: 'Orbitron';">${outcomeText}</h2>
            `;

        } catch (e) {
            console.error(e);
        }
    }
</script>
{% endblock %}
