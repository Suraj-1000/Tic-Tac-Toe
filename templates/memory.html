{% extends "base.html" %}

{% block title %}Neon Memory{% endblock %}

{% block head %}
<style>
    .memory-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-top: 30px;
        perspective: 1000px;
    }

    .card {
        width: 80px;
        height: 80px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s;
        cursor: pointer;
    }

    .card.flipped,
    .card.matched {
        transform: rotateY(180deg);
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2.5rem;
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }

    .card-front {
        background: linear-gradient(135deg, var(--bg-color-2), var(--bg-color-1));
        transform: rotateY(180deg);
        border-color: var(--primary);
        box-shadow: 0 0 15px var(--primary-glow);
    }

    .card-back {
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        /* Fix alignment */
    }

    .card-back::after {
        content: '?';
        color: var(--text-dim);
        font-family: 'Orbitron';
        font-size: 2rem;
    }

    .stats {
        display: flex;
        gap: 30px;
        justify-content: center;
        margin-bottom: 20px;
        font-family: 'Orbitron';
    }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <header>
        <h1>Neon <span class="highlight">Memory</span></h1>
        <p>Find the matching pairs</p>
    </header>

    <div class="stats">
        <div>Moves: <span id="moves" class="highlight">0</span></div>
        <div>Pairs: <span id="pairs">0</span>/8</div>
    </div>

    <div class="memory-grid" id="grid">
        <!-- Generated by JS -->
    </div>

    <button onclick="initGame()" class="btn primary huge" id="restart-btn" style="display:none; margin-top:30px;">Play
        Again</button>
</div>

<script>
    const icons = ['⚡', '💎', '🌙', '🚀', '🔥', '💀', '🤖', '⭐'];
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let lockBoard = false;

    function initGame() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        document.getElementById('restart-btn').style.display = 'none';
        matchedPairs = 0;
        moves = 0;
        updateStats();
        flippedCards = [];
        lockBoard = false;

        // Create pairs
        let deck = [...icons, ...icons];
        deck.sort(() => Math.random() - 0.5);

        deck.forEach(icon => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.innerHTML = `
                <div class="card-face card-back"></div>
                <div class="card-face card-front">${icon}</div>
            `;
            card.dataset.icon = icon;
            card.addEventListener('click', flipCard);
            grid.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === flippedCards[0]) return;

        this.classList.add('flipped');
        flippedCards.push(this);

        if (flippedCards.length === 2) {
            moves++;
            updateStats();
            checkForMatch();
        }
    }

    function checkForMatch() {
        let isMatch = flippedCards[0].dataset.icon === flippedCards[1].dataset.icon;

        if (isMatch) {
            disableCards();
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        flippedCards[0].classList.add('matched');
        flippedCards[1].classList.add('matched');
        matchedPairs++;
        updateStats();

        flippedCards = [];

        if (matchedPairs === 8) {
            setTimeout(() => {
                document.getElementById('restart-btn').style.display = 'block';
                // Could show a modal here
            }, 500);
        }
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            flippedCards[0].classList.remove('flipped');
            flippedCards[1].classList.remove('flipped');
            flippedCards = [];
            lockBoard = false;
        }, 1000);
    }

    function updateStats() {
        document.getElementById('moves').textContent = moves;
        document.getElementById('pairs').textContent = matchedPairs;
    }

    initGame();
</script>
{% endblock %}
