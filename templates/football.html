{% extends "base.html" %}

{% block title %}FootBall Physics{% endblock %}

{% block head %}
<style>
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
    }

    canvas {
        border: 4px solid white;
        background: #87CEEB;
        /* Sky Blue */
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        max-width: 100%;
    }

    .scoreboard {
        display: flex;
        gap: 50px;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 10px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 30px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .p1-score {
        color: #4facfe;
    }

    .p2-score {
        color: #ff4444;
    }

    .controls-hint {
        margin-top: 20px;
        color: #aaa;
        font-size: 0.9rem;
        text-align: center;
    }

    .key {
        display: inline-block;
        padding: 2px 6px;
        border: 1px solid #777;
        border-radius: 4px;
        background: #333;
        color: white;
        margin: 0 2px;
    }
</style>
{% endblock %}

{% block content %}
<div class="game-container">
    <div class="scoreboard">
        <div class="p1-score">P1: <span id="scoreP1">0</span></div>
        <div class="p2-score">P2: <span id="scoreP2">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls-hint">
        <p><span style="color:#4facfe">Player 1</span>: <span class="key">W</span> Jump &nbsp; <span
                class="key">A</span> Left &nbsp; <span class="key">D</span> Right</p>
        <p><span style="color:#ff4444">Player 2</span>: <span class="key">↑</span> Jump &nbsp; <span
                class="key">←</span> Left &nbsp; <span class="key">→</span> Right</p>
    </div>
</div>

<script src="{{ url_for('static', filename='game_football.js') }}"></script>
{% endblock %}
