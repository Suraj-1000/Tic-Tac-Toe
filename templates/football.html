{% extends "base.html" %}

{% block title %}Pro Football 11v11{% endblock %}

{% block head %}
<style>
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
    }

    /* Grass Field Style */
    canvas {
        border: 4px solid white;
        background: #2ecc71;
        /* Green Grass */
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        cursor: none;
    }

    .scoreboard {
        display: flex;
        justify-content: space-between;
        width: 1000px;
        margin-bottom: 10px;
        padding: 10px 20px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 10px;
        color: white;
        font-family: 'Arial', sans-serif;
        border: 2px solid white;
    }

    .team-score {
        font-size: 2.5rem;
        font-weight: bold;
    }

    .team-blue {
        color: #3498db;
    }

    .team-red {
        color: #e74c3c;
    }

    .timer {
        font-size: 2.5rem;
        color: #fff;
    }

    .controls-hint {
        margin-top: 15px;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 5px;
    }

    .key {
        display: inline-block;
        padding: 2px 6px;
        border: 1px solid #777;
        border-radius: 4px;
        background: #222;
        color: white;
        margin: 0 2px;
        font-family: monospace;
    }
</style>
{% endblock %}

{% block content %}
<div class="game-container">
    <div class="scoreboard">
        <div class="team-score team-blue">BLUE <span id="scoreBlue">0</span></div>
        <div class="timer" id="gameTimer">45:00</div>
        <div class="team-score team-red"><span id="scoreRed">0</span> RED</div>
    </div>

    <!-- Larger Canvas for 11v11 -->
    <canvas id="gameCanvas" width="1000" height="600"></canvas>

    <div class="controls-hint">
        <p>
            <span class="key">Arrows</span> / <span class="key">WASD</span> Move Active Player &nbsp;
            <span class="key">Space</span> / <span class="key">Click</span> Shoot/Pass &nbsp;
            <span class="key">Shift</span> Sprint
        </p>
    </div>
</div>

<script>
    // Configuration for Football/Futsal
    // game_type passed from Flask: '{{ game_type }}'
    const isFutsal = '{{ game_type }}' === 'futsal';

    window.SOCCER_CONFIG = {
        type: isFutsal ? 'futsal' : 'football',
        pitchColor: isFutsal ? '#34495e' : '#2ecc71', // Blue court for futsal
        lineColor: '#FFF',
        ballColor: '#FFF',
        playersPerTeam: isFutsal ? 5 : 11,
        matchDuration: 300,
        physics: {
            friction: isFutsal ? 0.94 : 0.98, // Court is faster/slippery? Or less friction? 0.94 is more friction (slows down faster). Actually Hard court = fast ball. Grass = slow ball. 
            // 0.98 (Grass) -> Ball slides long. 
            // Futsal Hard Court -> Ball rolls fast but stops? 
            // Let's keep similar for now.
            friction: 0.97,
            ballBounce: isFutsal ? 0.8 : 0.7,
            playerSpeed: 3.0,
            sprintSpeed: 5.0,
            kickForce: 8.0
        }
    };
</script>
<script src="{{ url_for('static', filename='game_soccer.js') }}?v={{ range(1, 10000) | random }}"></script>
{% endblock %}
